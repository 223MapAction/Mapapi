name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Free up disk space and clean workspace
        run: |
          docker system prune -af
          docker volume prune -f
          df -h
          # Repo was renamed Mapapi -> map-action-api, which changed the runner's
          # _work checkout dir (_work/<repo>/<repo>). This job's path was stale
          # after the rename, so it silently cleaned a directory that no longer
          # existed while Docker (running as root) kept writing __pycache__/*.pyc
          # as root into the REAL workspace via the bind mount (.:/app in
          # docker-compose.local.yml / _cd_pipeline.yml) -> Actions' own pre-checkout
          # clean then failed with EACCES trying to unlink root-owned files.
          sudo find /home/ec2-user/actions-runner/_work/map-action-api -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          sudo find /home/ec2-user/actions-runner/_work/map-action-api -name "*.pyc" -exec rm -f {} + 2>/dev/null || true
          sudo chown -R ec2-user:ec2-user /home/ec2-user/actions-runner/_work/map-action-api || true
          sudo chmod -R 755 /home/ec2-user/actions-runner/_work/map-action-api || true

  deploy:
    needs: cleanup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Clean Docker BEFORE build
        run: |
          docker system prune -af --volumes || true
          docker builder prune -af || true

      - name: Create .env file
        run: |
          {
            echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}"
            echo "ANDROID_CLIENT_ID=${{ secrets.ANDROID_CLIENT_ID }}"
            echo "DB_HOST=${{ secrets.DB_HOST }}"
            echo "DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}"
            echo "DJANGO_SUPERUSER_FIRST_NAME=${{ secrets.DJANGO_SUPERUSER_FIRST_NAME }}"
            echo "DJANGO_SUPERUSER_LAST_NAME=${{ secrets.DJANGO_SUPERUSER_LAST_NAME }}"
            echo "DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}"
            echo "DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}"
            echo "IOS_CLIENT_ID=${{ secrets.IOS_CLIENT_ID }}"
            echo "PORT=${{ secrets.PORT }}"
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}"
            echo "TEST_POSTGRES_DB=${{ secrets.TEST_POSTGRES_DB }}"
            echo "WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}"
            echo "WEB_CLIENT_SECRET=${{ secrets.WEB_CLIENT_SECRET }}"
            echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}"
            echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}"
            echo "TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "USE_SUPABASE_STORAGE=${{ secrets.USE_SUPABASE_STORAGE }}"
            echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}"
            echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}"
            echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}"
            echo "ORANGE_CLIENT_ID=${{ secrets.ORANGE_CLIENT_ID }}"
            echo "ORANGE_CLIENT_SECRET=${{ secrets.ORANGE_CLIENT_SECRET }}"
            echo "ORANGE_SENDER_ADDRESS=${{ secrets.ORANGE_SENDER_ADDRESS }}"
            echo "MODEL_DEPLOY_ANALYZE_URL=${{ secrets.MODEL_DEPLOY_ANALYZE_URL }}"
            echo "MODEL_DEPLOY_TIMEOUT=${{ secrets.MODEL_DEPLOY_TIMEOUT }}"
            echo "MODEL_DEPLOY_CHAT_URL=${{ secrets.MODEL_DEPLOY_CHAT_URL }}"
            echo "MODEL_DEPLOY_CHAT_TIMEOUT=${{ secrets.MODEL_DEPLOY_CHAT_TIMEOUT }}"
            echo "FCM_CREDENTIALS_JSON_BASE64=${{ secrets.FCM_CREDENTIALS_JSON_BASE64 }}"
            echo "LOG_LEVEL=INFO"
            echo "ACCESS_LOG_LEVEL=WARNING"
            echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}"
            echo "SENTRY_ENVIRONMENT=production"
            echo "SENTRY_RELEASE=${{ github.sha }}"
            echo "SENTRY_SERVER_NAME=map-action-api"
            echo "SENTRY_TRACES_SAMPLE_RATE=0.0"
            echo "SENTRY_ENABLE_LOGS=False"
          } > .env

      - name: Build and Deploy Docker Image
        run: |
          # Pin the Compose project name to `mapapi` (the pre-existing running
          # stack). The repo was renamed Mapapi -> map-action-api, which changed the
          # runner checkout dir and thus the default project name -> Compose tried to
          # create a NEW network on the same fixed subnet (192.168.0.0/24) while the
          # old `mapapi` network was still up -> "Pool overlaps". Pinning makes `down`
          # tear down the running stack and `up` recreate it under the same network.
          docker-compose -p mapapi -f _cd_pipeline.yml build
          docker-compose -p mapapi -f _cd_pipeline.yml down --remove-orphans
          docker-compose -p mapapi -f _cd_pipeline.yml up --build -d

      - name: Post-deployment cleanup
        if: always()
        run: |
          docker system prune -af --volumes
          docker image prune -af
          docker volume prune -f
